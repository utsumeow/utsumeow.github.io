*::selection {

* {
    box-sizing: border-box;

    margin: 0;
    image-rendering: pixelated;
    scroll-behavior: smooth;
    font-weight: 100;
    -webkit-font-smoothing: antialiased;
    max-width: 100%;
    transition: ease-in-out 0.2s;
}

@keyframes bgtoleft {
    0% { background-position-x: 0; }
    100% { background-position-x: -177.7778vh; }
}

body {
    width: 100%;
    min-height: 100vh;
    position: relative;
    background: url("https://file.garden/acqMvXMS1QleW-ez/bgbg.svg"), linear-gradient(to bottom, #fe3187, white);

    background-repeat: repeat-x;
    background-attachment: fixed;
    overflow-y: scroll;
    animation: bgtoleft 30s linear infinite;
    animation-play-state: running;

.custom-cursor {
      position: fixed;
  top: 0;
  left: 0;
  width: 30px;
  height: 30px;
  background-color: #fff;
  pointer-events: none; 
  mix-blend-mode: difference; 
  transform: translate(-50%, -50%);
  transition: transform 0.1s ease;
  z-index: 9998;
  clip-path: polygon(
    35% 0%, 65% 0%, 
    65% 35%, 100% 35%, 
    100% 65%, 65% 65%, 
    65% 100%, 35% 100%, 
    35% 65%, 0% 65%, 
    0% 35%, 35% 35%
  );
}






#container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    height: fit-content;
    background: white;

    flex-direction: column;

    overflow-y: visible;
    overflow-x: clip;
}

#header {

#header img {

#content {

.gallwarp {

#showcase {

#preloader {

cursor: pointer;}

<script>   const MIN_TIME = 100; 
  const startTime = Date.now();

  window.addEventListener("load", () => {
    const preloader = document.getElementById("preloader");

    const elapsed = Date.now() - startTime;
    const remaining = Math.max(0, MIN_TIME - elapsed);

    setTimeout(() => {
      preloader.classList.add("fade-out");

      setTimeout(() => {
        preloader.style.display = "none";
      }, 500); 
    }, remaining);
  }); </script>

    <script>
        function showGallery(event, galleryId) {
            let i, galleryContent, galleryButtons;
            galleryContent = document.querySelectorAll("#showcase > div");
            for (i = 0; i < galleryContent.length; i++) {
                galleryContent[i].style.display = "none";
            }
            galleryButtons = document.getElementsByClassName("gallbtn");
            for (i = 0; i < galleryButtons.length; i++) {
                galleryButtons[i].className = galleryButtons[i].className.replace(" active", "");
            }
            document.getElementById(galleryId).style.display = "grid";
            event.currentTarget.className += " active";
        }
        window.onload = function() {
        document.getElementById("gall1").click();
    };

    </script>
    <script>
        function openModal(src) {
            document.getElementById("modalImage").src = src;
            document.getElementById("myModal").style.display="block";
        }
        function closeModal() {
            document.getElementById("myModal").style.display = "none";
        }
    </script>
    <script>
        const bodyBox = document.body;
        const togBtn = document.getElementById('aniToggle');

        togBtn.addEventListener('click', () => {
            const isRunning = window.getComputedStyle(bodyBox).animationPlayState === 'running';
        if (isRunning) {
            bodyBox.style.animationPlayState = 'paused';
        } else {
            bodyBox.style.animationPlayState = 'running';} 
        });
    </script>
    <script>
    const cursor = document.querySelector('.custom-cursor');

window.addEventListener('mousemove', (e) => {
  const x = e.clientX+20;
  const y = e.clientY+20;
  
  cursor.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
});</script>
